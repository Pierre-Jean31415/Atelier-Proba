const R=String.raw;
function tex(el){const M=window.MathJax;if(M&&M.startup&&M.startup.promise){M.startup.promise=M.startup.promise.then(()=>M.typesetPromise([el])).catch(()=>{});}}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return "q"+(h>>>0).toString(36)}
const THEMES={res:"Résultat / événement",den:"Dénombrement",par:"Parties d'un ensemble",indic:"Fonctions indicatrices",union:"Systèmes complets, réunions, crible",ind:"Incompatibles / indépendants",cond:"Probabilités conditionnelles",fpt:"Probabilités totales",dist:"Totales ou composées ?",var:"Variables aléatoires",loi:"Lois usuelles"};

/* ======================= RAPPELS DE COURS ======================= */
const RAPPEL={
res:R`<p>L'ensemble des résultats possibles est appelé l'<b>univers</b>, noté $\Omega$. Un <b>résultat</b> est un <b>élément</b> $\omega$ de $\Omega$ : $\omega\in\Omega$.</p>
<p>Les <b>événements</b> sont les <b>parties</b> de $\Omega$ : $A\subset\Omega$, c'est-à-dire $A\in\mathscr P(\Omega)$. Un événement est un ensemble de résultats.</p>
<p>Les singletons $\{\omega\}$ sont les <b>événements élémentaires</b>. $\varnothing$ est l'événement impossible, $\Omega$ l'événement certain. Si $\omega\in A$, on dit que « $\omega$ réalise $A$ ».</p>
<p>On calcule $\mathbb P(A)$ pour un événement. Pour un résultat, on écrit $\mathbb P(\{\omega\})$, jamais $\mathbb P(\omega)$. En situation d'équiprobabilité : $\mathbb P(A)=\dfrac{\operatorname{card}(A)}{\operatorname{card}(\Omega)}$.</p>`,
den:R`<p>Dans tout ce rappel, $E$ est un ensemble fini de <b>cardinal $n$</b> et $p\in\mathbb N^*$.</p>
<p>Deux questions avant tout calcul : <b>l'ordre compte-t-il ? les répétitions sont-elles possibles ?</b></p>
<div class="scroll"><table class="t"><thead><tr><th>Ordre</th><th>Répétitions</th><th>Un résultat est…</th><th>Nombre</th><th>Situation type</th></tr></thead><tbody>
<tr><td>oui</td><td>oui</td><td>une $p$-liste de $E$ (élément de $E^p$)</td><td>$n^p$</td><td>tirages successifs avec remise</td></tr>
<tr><td>oui</td><td>non</td><td>une $p$-liste sans répétition (arrangement)</td><td>$n(n-1)\cdots(n-p+1)=\dfrac{n!}{(n-p)!}$</td><td>tirages successifs sans remise</td></tr>
<tr><td>oui</td><td>non, $p=n$</td><td>une permutation de $E$</td><td>$n!$</td><td>choisir successivement tous les objets</td></tr>
<tr><td>non</td><td>non</td><td>une $p$-combinaison (partie à $p$ éléments)</td><td>$\dbinom np=\dfrac{n(n-1)\cdots(n-p+1)}{p!}$</td><td>tirage simultané</td></tr></tbody></table></div>
<p>Une liste s'écrit entre <b>parenthèses</b> $(x_1,\dots,x_p)$, une combinaison entre <b>accolades</b> $\{x_1,\dots,x_p\}$. On note $\mathscr P_p(E)$ l'ensemble des $p$-combinaisons de $E$.</p>
<p>Avec une $p$-combinaison, on construit $p!$ listes sans répétition : c'est pourquoi $n(n-1)\cdots(n-p+1)=p!\dbinom np$.</p>
<p>Cardinaux : $\operatorname{card}(A\cup B)=\operatorname{card}(A)+\operatorname{card}(B)-\operatorname{card}(A\cap B)$ ; $\operatorname{card}(\overline A)=\operatorname{card}(E)-\operatorname{card}(A)$ ; $\operatorname{card}(A\times B)=\operatorname{card}(A)\operatorname{card}(B)$ ; $\operatorname{card}([\![a;b]\!])=b-a+1$.</p>`,
par:R`<p>$A$ est une <b>partie</b> de $E$, et on écrit $A\subset E$, si tout élément de $A$ est un élément de $E$.</p>
<p>$\mathscr P(E)$ est l'ensemble de <b>toutes</b> les parties de $E$, y compris $\varnothing$ et $E$. Exemple : $\mathscr P(\{a,b\})=\{\varnothing,\{a\},\{b\},\{a,b\}\}$.</p>
<p>Si $\operatorname{card}(E)=n$, alors $\operatorname{card}\big(\mathscr P(E)\big)=2^n$. Deux démonstrations du cours :</p>
<p>① les $\mathscr P_p(E)$, pour $0\leqslant p\leqslant n$, forment une partition de $\mathscr P(E)$, donc $\operatorname{card}\big(\mathscr P(E)\big)=\sum_{p=0}^n\binom np=(1+1)^n=2^n$ ;</p>
<p>② à chaque partie $A$, on associe la liste $(x_1,\dots,x_n)\in\{0;1\}^n$ avec $x_i=1$ si $e_i\in A$ et $x_i=0$ sinon : c'est une bijection, et $\operatorname{card}\big(\{0;1\}^n\big)=2^n$.</p>
<p>$a\in E$ (élément), $\{a\}\subset E$ (partie), $\{a\}\in\mathscr P(E)$.</p>`,
indic:R`<p><b>Définition.</b> Si $A$ est une partie de $E$, la fonction indicatrice de $A$ est l'application $\mathbf 1_A$ de $E$ dans $\{0,1\}$ qui à $x$ associe $1$ si $x\in A$ et $0$ sinon. Si $A=\{x\in E\mid P(x)\}$, on note aussi $\mathbf 1_{P(x)}=\mathbf 1_A(x)$.</p>
<p><b>Propriétés.</b> ① $\mathbf 1_A(x)=1\iff x\in A$ ; ② $\mathbf 1_{A\cap B}=\mathbf 1_A\times\mathbf 1_B$ ; ③ $\mathbf 1_{\overline A}=1-\mathbf 1_A$ ; ④ $\mathbf 1_A=\mathbf 1_B\iff A=B$ ; ⑤ $\mathbf 1_A\leqslant\mathbf 1_B\iff A\subset B$. Enfin $\mathbf 1_\varnothing=0$ et $\mathbf 1_E=1$ (applications constantes).</p>
<p><b>Dénombrer.</b> Si $E$ est fini : $\operatorname{card}(A)=\sum_{x\in E}\mathbf 1_A(x)$, $\ \operatorname{card}(A\cap B)=\sum_{x\in A}\mathbf 1_B(x)$, $\ \sum_{x\in E}\mathbf 1_{P(x)}=\operatorname{card}\big(\{x\in E\mid P(x)\}\big)$.</p>
<p><b>En probabilités.</b> Si $A$ est un événement, $\mathbf 1_A\hookrightarrow\mathcal B\big(\mathbb P(A)\big)$ : $\mathbb E(\mathbf 1_A)=\mathbb P(A)$ et $V(\mathbf 1_A)=\mathbb P(A)\big(1-\mathbb P(A)\big)$.</p>`,
union:R`<p><b>Système complet d'événements.</b> $(A_1,\dots,A_n)$ est un système complet d'événements si ① $\bigcup_{k=1}^n A_k=\Omega$ et ② $\forall (i,j)\in[\![1;n]\!]^2,\ i\neq j\Longrightarrow A_i\cap A_j=\varnothing$. Chaque résultat réalise alors exactement un des $A_k$. Conséquence : $\sum_{i=1}^n\mathbb P(A_i)=1$. Par exemple, $(A,\overline A)$ est un système complet, d'où $\mathbb P(\overline A)=1-\mathbb P(A)$.</p>
<p><b>Probabilité d'une réunion disjointe.</b> Si $\forall (i,j)\in[\![1;n]\!]^2,\ i\neq j\Longrightarrow A_i\cap A_j=\varnothing$, alors $\mathbb P\Big(\bigcup_{i=1}^n A_i\Big)=\sum_{i=1}^n\mathbb P(A_i)$ : une <b>somme</b>. De même pour les cardinaux : $\operatorname{card}\Big(\bigcup_{i=1}^p A_i\Big)=\sum_{i=1}^p\operatorname{card}(A_i)$.</p>
<p><b>Formule du crible</b>, pour des événements quelconques :</p>
<p>ordre 2 : $\mathbb P(A\cup B)=\mathbb P(A)+\mathbb P(B)-\mathbb P(A\cap B)$ ;</p>
<p>ordre 3 : $\mathbb P(A\cup B\cup C)=\mathbb P(A)+\mathbb P(B)+\mathbb P(C)-\mathbb P(A\cap B)-\mathbb P(A\cap C)-\mathbb P(B\cap C)+\mathbb P(A\cap B\cap C)$.</p>
<p>Les mêmes formules valent pour les cardinaux. Si les événements sont incompatibles, les intersections sont vides et on retrouve la réunion disjointe.</p>
<p><b>Conséquences.</b> Si $A\subset B$, alors $\mathbb P(A)\leqslant\mathbb P(B)$. Pour tous événements : $\mathbb P\Big(\bigcup_{k=1}^n A_k\Big)\leqslant\sum_{k=1}^n\mathbb P(A_k)$.</p>`,
ind:R`<div class="scroll"><table class="t"><thead><tr><th></th><th>Incompatibles</th><th>Indépendants</th></tr></thead><tbody>
<tr><td>Définition</td><td>$A\cap B=\varnothing$</td><td>$\mathbb P(A\cap B)=\mathbb P(A)\,\mathbb P(B)$</td></tr>
<tr><td>Dépend de $\mathbb P$ ?</td><td>non : on le voit sur les ensembles</td><td>oui : il faut calculer</td></tr>
<tr><td>Sens</td><td>A et B ne peuvent pas se produire ensemble</td><td>savoir que A est réalisé ne change pas la probabilité de B</td></tr>
<tr><td>Sert à</td><td>$\mathbb P(A\cup B)=\mathbb P(A)+\mathbb P(B)$</td><td>$\mathbb P(A\cap B)=\mathbb P(A)\,\mathbb P(B)$</td></tr></tbody></table></div>
<p><b>Piège.</b> Si $\mathbb P(A)>0$, $\mathbb P(B)>0$ et $A$, $B$ incompatibles, alors ils ne sont <b>pas</b> indépendants : $\mathbb P(A\cap B)=0\neq\mathbb P(A)\mathbb P(B)$.</p>
<p>$A$ et $B$ indépendants équivaut à $A$ et $\overline B$ indépendants (de même pour $\overline A$ et $B$, et pour $\overline A$ et $\overline B$).</p>
<p><b>Mutuellement indépendants</b> : $\mathbb P\Big(\bigcap_{j\in J}A_j\Big)=\prod_{j\in J}\mathbb P(A_j)$ pour toute partie $J$ de $[\![1;n]\!]$. Mutuellement indépendants entraîne 2 à 2 indépendants ; la réciproque est fausse.</p>
<p><b>Expériences indépendantes</b> : des événements liés à des épreuves distinctes sont mutuellement indépendants (tirages successifs avec remise, lancers successifs…).</p>`,
cond:R`<p><b>Définition.</b> Si $\mathbb P(A)\neq0$, l'application $\mathbb P_A:B\mapsto\dfrac{\mathbb P(A\cap B)}{\mathbb P(A)}$ est une probabilité, appelée probabilité sachant $A$. On note aussi $\mathbb P_A(B)=\mathbb P(B\,|\,A)$, mais « $B\,|\,A$ » n'est pas un événement.</p>
<p>$\mathbb P_A(A)=1$. En situation d'équiprobabilité : $\mathbb P_A(B)=\dfrac{\operatorname{card}(A\cap B)}{\operatorname{card}(A)}$.</p>
<p><b>Probabilités composées.</b> $\mathbb P(A\cap B)=\mathbb P(A)\,\mathbb P_A(B)$, et plus généralement, si $\mathbb P(A_1\cap\dots\cap A_{n-1})\neq0$ :
$$\mathbb P(A_1\cap\dots\cap A_n)=\mathbb P(A_1)\,\mathbb P_{A_1}(A_2)\cdots\mathbb P_{A_1\cap\dots\cap A_{n-1}}(A_n).$$</p>
<p>$\mathbb P_A$ est une probabilité : $\mathbb P_A(\overline B)=1-\mathbb P_A(B)$ et $\mathbb P_A(B\cup C)=\mathbb P_A(B)+\mathbb P_A(C)-\mathbb P_A(B\cap C)$.</p>
<p><b>Pièges.</b> $\mathbb P_A(B)\neq\mathbb P_B(A)$ en général. $\mathbb P_A(B)\neq\mathbb P(A\cap B)$. $\mathbb P_{\overline A}(B)$ n'est pas $1-\mathbb P_A(B)$. Dans un arbre, la branche de $A$ vers $B$ porte $\mathbb P_A(B)$.</p>`,
fpt:R`<p><b>Système complet d'événements.</b> $(A_1,\dots,A_n)$ est un système complet d'événements si ① $\bigcup_{k=1}^n A_k=\Omega$ et ② $\forall (i,j)\in[\![1;n]\!]^2,\ i\neq j\Longrightarrow A_i\cap A_j=\varnothing$. Alors $\sum_{i=1}^n\mathbb P(A_i)=1$.</p>
<p><b>Formule des probabilités totales : deux versions.</b></p>
<p>① Si $(A_1,\dots,A_n)$ est un système complet d'événements, alors pour tout événement $B$ : $\mathbb P(B)=\sum_{i=1}^n \mathbb P(A_i\cap B)$. Aucune autre hypothèse.</p>
<p>② Si $(A_1,\dots,A_n)$ est un système complet d'événements <b>non négligeables</b> (pour tout $i$, $\mathbb P(A_i)\neq0$), alors pour tout événement $B$ :
$$\mathbb P(B)=\sum_{i=1}^n \mathbb P(A_i)\times\mathbb P_{A_i}(B).$$
L'hypothèse sert à définir les $\mathbb P_{A_i}$. (Avec la convention $\mathbb P(A_i)\mathbb P_{A_i}(B)=0$ si $\mathbb P(A_i)=0$, on peut s'en passer.)</p>
<p><b>Quand l'utiliser ?</b> Quand l'expérience se fait en deux temps et que la probabilité de $B$ dépend du premier temps (le dé, l'urne choisie, malade ou non). Sur un arbre : $\mathbb P(B)$ est la somme des probabilités des chemins qui mènent à $B$.</p>
<p><b>Rédaction.</b> ① Nommer les événements. ② Le système complet porte sur le premier temps : le justifier. ③ Pour la version ②, vérifier que les $\mathbb P(A_i)$ sont non nulles. ④ Écrire « D'après la formule des probabilités totales », puis calculer.</p>
<p><b>Formule de Bayes.</b> Si $(A_1,\dots,A_n)$ est un système complet d'événements non négligeables et $B$ un événement non négligeable : $\mathbb P_B(A_j)=\dfrac{\mathbb P(A_j)\,\mathbb P_{A_j}(B)}{\sum_{i=1}^n\mathbb P(A_i)\,\mathbb P_{A_i}(B)}$.</p>
<p>Avec une variable aléatoire : les $[X=x_i]$ forment un système complet, donc $\mathbb P(A)=\sum_{i=1}^r\mathbb P([X=x_i])\,\mathbb P_{[X=x_i]}(A)$.</p>`,
dist:R`<div class="scroll"><table class="t"><thead><tr><th></th><th>Probabilités composées</th><th>Probabilités totales</th></tr></thead><tbody>
<tr><td>On cherche</td><td>la probabilité d'une <b>intersection</b> : $\mathbb P(A_1\cap\dots\cap A_n)$</td><td>la probabilité d'un événement $B$ auquel <b>plusieurs chemins</b> mènent : $\mathbb P(B)$</td></tr>
<tr><td>Indices</td><td>« et », « … puis … », « les trois boules sont rouges »</td><td>« la 2e boule est rouge » (sans rien dire de la 1re), « une pièce prise au hasard est défectueuse »</td></tr>
<tr><td>Sur l'arbre</td><td>on <b>multiplie</b> le long d'<b>un</b> chemin</td><td>on <b>additionne</b> les probabilités de <b>tous</b> les chemins qui mènent à $B$</td></tr>
<tr><td>Formule</td><td>$\mathbb P(A_1)\,\mathbb P_{A_1}(A_2)\cdots\mathbb P_{A_1\cap\dots\cap A_{n-1}}(A_n)$</td><td>$\sum_{i=1}^n\mathbb P(A_i)\times\mathbb P_{A_i}(B)$</td></tr>
<tr><td>Hypothèse</td><td>$\mathbb P(A_1\cap\dots\cap A_{n-1})\neq0$</td><td>$(A_1,\dots,A_n)$ système complet d'événements non négligeables</td></tr></tbody></table></div>
<p><b>Les deux formules travaillent ensemble</b> : chaque terme $\mathbb P(A_i)\times\mathbb P_{A_i}(B)$ de la formule des probabilités totales est la probabilité $\mathbb P(A_i\cap B)$ d'un chemin, calculée par les probabilités composées.</p>
<p><b>Erreurs classiques.</b> Ne garder qu'un chemin ($\mathbb P(B)=\mathbb P(A_1)\mathbb P_{A_1}(B)$) ; oublier les poids ($\mathbb P(B)=\sum\mathbb P_{A_i}(B)$) ; additionner le long d'un chemin au lieu de multiplier.</p>
<p><b>Contrôle</b> : $\mathbb P(B)$ obtenue par la formule des probabilités totales est une moyenne pondérée des $\mathbb P_{A_i}(B)$, donc comprise entre la plus petite et la plus grande.</p>`,
var:R`<p>Les <b>variables aléatoires</b> sur $\Omega$ sont les applications de $\Omega$ dans $\mathbb R$. $X(\Omega)=\{X(\omega)\mid\omega\in\Omega\}$ est l'ensemble des valeurs prises. $[X=a]=\{\omega\in\Omega\mid X(\omega)=a\}$ est un <b>événement</b>.</p>
<p>Si $X(\Omega)=\{x_1,\dots,x_r\}$, les $[X=x_i]$ forment un <b>système complet d'événements</b>.</p>
<p><b>Déterminer la loi de $X$</b> : ① donner $X(\Omega)$ ; ② donner $\mathbb P([X=x_i])$ pour toutes les valeurs $x_i$. Ces probabilités sont positives et ont pour somme 1.</p>
<p><b>Fonction de répartition</b> : $F:x\mapsto\mathbb P([X\leqslant x])$, de $\mathbb R$ dans $[0;1]$. $\mathbb P([a\lt X\leqslant b])=F(b)-F(a)$. $F$ est croissante, constante par morceaux, continue à droite, discontinue à gauche en chaque $x_i$ où $\mathbb P([X=x_i])\neq0$ ; elle tend vers 0 en $-\infty$ et vers 1 en $+\infty$.</p>
<p><b>Espérance</b> : $\mathbb E(X)=\sum_{x\in X(\Omega)}x\,\mathbb P([X=x])$. <b>Transfert</b> : $\mathbb E\big(\varphi(X)\big)=\sum_{x\in X(\Omega)}\varphi(x)\,\mathbb P([X=x])$. <b>Linéarité</b> (toujours vraie) : $\mathbb E(aX+bY)=a\,\mathbb E(X)+b\,\mathbb E(Y)$.</p>
<p><b>Variance</b> : $V(X)=\mathbb E\big((X-\mathbb E(X))^2\big)\geqslant0$. Kœnig-Huygens : $V(X)=\mathbb E(X^2)-\big(\mathbb E(X)\big)^2$. $V(aX+b)=a^2\,V(X)$. Écart-type : $\sigma=\sqrt{V(X)}$. Si $V(X)=0$, alors $\mathbb P([X=m])=1$ : $X$ est quasi-certaine.</p>
<p><b>Centrée</b> : $\mathbb E(X)=0$. <b>Réduite</b> : $V(X)=1$. $X^*=\dfrac{X-\mathbb E(X)}{\sigma_X}$ est la variable centrée réduite associée à $X$.</p>
<p><b>Indépendance</b> : $X$ et $Y$ sont indépendantes si, pour tout $(x,y)\in X(\Omega)\times Y(\Omega)$, $\mathbb P([X=x]\cap[Y=y])=\mathbb P([X=x])\,\mathbb P([Y=y])$. Alors $u(X)$ et $v(Y)$ sont indépendantes, $\mathbb E(XY)=\mathbb E(X)\,\mathbb E(Y)$ et $V(X+Y)=V(X)+V(Y)$. Sans indépendance, ces deux formules sont fausses en général.</p>`,
loi:R`<div class="scroll"><table class="t"><thead><tr><th>Loi</th><th>Situation type</th><th>$X(\Omega)$ et $\mathbb P([X=k])$</th><th>$\mathbb E(X)$</th><th>$V(X)$</th></tr></thead><tbody>
<tr><td>Certaine égale à $a$</td><td>$X$ constante</td><td>$\{a\}$, $\mathbb P([X=a])=1$</td><td>$a$</td><td>$0$</td></tr>
<tr><td>Bernoulli $\mathcal B(p)$, $p\in\,]0,1[$</td><td>une épreuve, succès ou échec ; $X=1$ si succès</td><td>$\{0,1\}$, $\mathbb P([X=1])=p$</td><td>$p$</td><td>$p(1-p)$</td></tr>
<tr><td>Uniforme $\mathcal U([\![1;n]\!])$</td><td>$n$ valeurs équiprobables</td><td>$[\![1;n]\!]$, $\dfrac1n$</td><td>$\dfrac{n+1}2$</td><td>$\dfrac{n^2-1}{12}$</td></tr>
<tr><td>Uniforme $\mathcal U([\![a;b]\!])$</td><td>$b-a+1$ valeurs équiprobables</td><td>$[\![a;b]\!]$, $\dfrac1{b-a+1}$</td><td>$\dfrac{a+b}2$</td><td>$\dfrac{(b-a+1)^2-1}{12}$</td></tr>
<tr><td>Binomiale $\mathscr B(n,p)$</td><td>schéma de Bernoulli : $X$ compte les succès</td><td>$[\![0;n]\!]$, $\dbinom nk p^k(1-p)^{n-k}$</td><td>$np$</td><td>$np(1-p)$</td></tr></tbody></table></div>
<p><b>Schéma de Bernoulli.</b> On répète $n$ fois, de façon <b>identique et indépendante</b>, une épreuve à deux issues (succès de probabilité $p$, ou échec). Le nombre $X$ de succès suit $\mathscr B(n,p)$. Si les épreuves ne sont pas indépendantes (tirages <b>sans</b> remise) ou si $p$ change, ce n'est pas une binomiale.</p>
<p><b>Rédaction type.</b> « Cette expérience est constituée de $n$ épreuves de Bernoulli identiques et indépendantes (succès : … de probabilité $p$). $X$ compte le nombre de succès, donc $X\hookrightarrow\mathscr B(n,p)$. »</p>
<p><b>Autres résultats.</b> Si $A$ est un événement, $\mathbf 1_A\hookrightarrow\mathcal B\big(\mathbb P(A)\big)$. La somme de $n$ variables de Bernoulli de paramètre $p$ mutuellement indépendantes suit $\mathscr B(n,p)$.</p>`
};

{t:"indic",q:R`$A_1,\dots,A_n$ sont des événements et $N=\sum_{k=1}^n\mathbf 1_{A_k}$. Que représente $N$ ?`,c:[R`le nombre d'événements $A_k$ réalisés`,R`la probabilité que l'un des $A_k$ soit réalisé`,R`le nombre de résultats de $\Omega$`],a:0,e:R`Pour un résultat $\omega$, chaque $A_k$ réalisé ajoute 1. Par linéarité : $\mathbb E(N)=\sum_{k=1}^n\mathbb P(A_k)$.`},

{t:"ind",q:R`Dé équilibré. $A$ : « le résultat est pair », $B$ : « le résultat est inférieur ou égal à 2 ».`,c:["incompatibles","indépendants","ni l'un ni l'autre"],a:1,e:R`$\mathbb P(A\cap B)=\mathbb P(\{2\})=\frac16=\frac12\times\frac13$.`},
{t:"ind",q:R`Dé équilibré. $A$ : « le résultat est pair », $B$ : « le résultat est impair ».`,c:["incompatibles","indépendants","ni l'un ni l'autre"],a:0,e:R`$A\cap B=\varnothing$. Ils ne sont pas indépendants : $0\neq\frac12\times\frac12$.`},
{t:"ind",q:R`Dé équilibré. $A$ : « le résultat est pair », $D$ : « le résultat est inférieur ou égal à 3 ».`,c:["incompatibles","indépendants","ni l'un ni l'autre"],a:2,e:R`$A\cap D=\{2\}\neq\varnothing$ et $\mathbb P(A\cap D)=\frac16\neq\frac12\times\frac12$.`},
{t:"ind",q:R`$A$ et $B$ sont indépendants. Alors $A$ et $\overline B$ :`,c:["sont indépendants","sont incompatibles","on ne peut pas savoir"],a:0,e:R`Proposition du cours : $\mathbb P(A\cap\overline B)=\mathbb P(A)-\mathbb P(A)\mathbb P(B)=\mathbb P(A)\,\mathbb P(\overline B)$.`},
{t:"ind",q:"Mutuellement indépendants et deux à deux indépendants :",c:["mutuellement entraîne 2 à 2, la réciproque est fausse","c'est la même chose","2 à 2 entraîne mutuellement"],a:0,e:R`Contre-exemple du cours : deux lancers, $A$ « le premier lancer donne Pile », $B$ « le deuxième lancer donne Pile », $C$ « les deux lancers donnent le même résultat ».`},
{t:"ind",q:R`Deux lancers d'une pièce équilibrée. $A$ : « le premier lancer donne Pile », $B$ : « le deuxième lancer donne Pile », $C$ : « les deux lancers donnent le même résultat ». $\mathbb P(A\cap B\cap C)=$`,c:[R`$\frac14$`,R`$\frac18$`,R`$\frac12$`],a:0,e:R`$A\cap B\cap C=\{PP\}$ : $\frac14\neq\frac18=\mathbb P(A)\mathbb P(B)\mathbb P(C)$. Ils sont 2 à 2 indépendants mais pas mutuellement indépendants.`},
{t:"ind",q:R`Définition : $A_1,\dots,A_n$ sont mutuellement indépendants si :`,c:[R`pour toute partie $J$ de $[\![1;n]\!]$, $\mathbb P\big(\bigcap_{j\in J}A_j\big)=\prod_{j\in J}\mathbb P(A_j)$`,R`$\mathbb P(A_1\cap\dots\cap A_n)=\mathbb P(A_1)\cdots\mathbb P(A_n)$ seulement`,R`ils sont deux à deux indépendants`],a:0,e:"La condition doit être vraie pour toutes les sous-familles, pas seulement pour la famille entière."},
{t:"ind",q:R`Deux lancers d'une pièce. $A$ : « le premier lancer donne Pile », $B$ : « le deuxième lancer donne Pile ».`,c:["incompatibles","indépendants","ni l'un ni l'autre"],a:1,e:R`Les lancers sont indépendants. Ils ne sont pas incompatibles : $(P,P)$ est possible.`},
{t:"cond",q:R`À quelle condition peut-on écrire $\mathbb P_A(B)$ ?`,c:[R`$\mathbb P(A)\neq0$`,R`$\mathbb P(B)\neq0$`,R`$A$ et $B$ indépendants`],a:0,e:R`On divise par $\mathbb P(A)$ : $\mathbb P_A(B)=\dfrac{\mathbb P(A\cap B)}{\mathbb P(A)}$.`},
{t:"cond",q:R`On note aussi $\mathbb P_A(B)=\mathbb P(B\,|\,A)$. « $B\,|\,A$ » est-il un événement ?`,c:["Non","Oui"],a:0,e:R`C'est seulement une notation : on conditionne par $A$, la probabilité change ($\mathbb P_A$), l'événement reste $B$.`},
{t:"cond",q:R`$\mathbb P(A)\neq0$. $\mathbb P_A(A)=$`,c:["1",R`$\mathbb P(A)$`,"0"],a:0,e:R`$\mathbb P_A(A)=\dfrac{\mathbb P(A\cap A)}{\mathbb P(A)}=1$.`},
{t:"cond",q:R`En situation d'équiprobabilité, $\mathbb P_A(B)=$`,c:[R`$\dfrac{\operatorname{card}(A\cap B)}{\operatorname{card}(A)}$`,R`$\dfrac{\operatorname{card}(A\cap B)}{\operatorname{card}(\Omega)}$`,R`$\dfrac{\operatorname{card}(B)}{\operatorname{card}(A)}$`],a:0,e:R`Tout se passe comme si l'univers devenait $A$.`},
{t:"cond",q:R`$\mathbb P(A)=0{,}4$ et $\mathbb P(A\cap B)=0{,}1$. $\mathbb P_A(B)=$`,c:["0,25","0,04","0,1","0,4"],a:0,e:R`$\mathbb P_A(B)=\dfrac{0{,}1}{0{,}4}=0{,}25$.`},
{t:"cond",q:R`$\mathbb P_A(B)=0{,}3$. $\mathbb P_A(\overline B)=$`,c:["0,7","0,3","on ne peut pas savoir"],a:0,e:R`$\mathbb P_A$ est une probabilité : $\mathbb P_A(\overline B)=1-\mathbb P_A(B)=0{,}7$.`},
{t:"cond",q:R`$\mathbb P_A(B)=0{,}3$. $\mathbb P_{\overline A}(B)=$`,c:["on ne peut pas savoir","0,7","0,3"],a:0,e:R`On conditionne par un autre événement : $\mathbb P_A$ et $\mathbb P_{\overline A}$ sont deux probabilités différentes. Seul $\mathbb P_A(\overline B)$ vaut $0{,}7$.`},
{t:"cond",q:R`En général, $\mathbb P_A(B)$ et $\mathbb P_B(A)$ :`,c:["sont différents","sont égaux","ont pour somme 1"],a:0,e:R`$\mathbb P_A(B)=\dfrac{\mathbb P(A\cap B)}{\mathbb P(A)}$ et $\mathbb P_B(A)=\dfrac{\mathbb P(A\cap B)}{\mathbb P(B)}$ : les dénominateurs diffèrent. Exemple du dépistage ($M$ : « l'individu est malade », $T$ : « le test est positif ») : $\mathbb P_M(T)=0{,}99$ mais $\mathbb P_T(M)=\frac13$.`},
{t:"cond",q:R`$A$ et $B$ sont indépendants, avec $\mathbb P(A)\neq0$. $\mathbb P_A(B)=$`,c:[R`$\mathbb P(B)$`,R`$\mathbb P(A)$`,R`$\mathbb P(A)\mathbb P(B)$`,"0"],a:0,e:R`$\mathbb P_A(B)=\dfrac{\mathbb P(A)\mathbb P(B)}{\mathbb P(A)}=\mathbb P(B)$ : savoir que $A$ est réalisé ne change rien pour $B$.`},
{t:"cond",q:R`On lance un dé équilibré. Sachant que le résultat est pair, quelle est la probabilité d'avoir obtenu 6 ?`,c:[R`$\frac13$`,R`$\frac16$`,R`$\frac12$`],a:0,e:R`$\mathbb P_{\text{pair}}(\{6\})=\dfrac{\mathbb P(\{6\})}{\mathbb P(\{2,4,6\})}=\dfrac{1/6}{1/2}=\dfrac13$.`},
{t:"cond",q:R`On lance deux dés équilibrés. Sachant que la somme vaut 8, quelle est la probabilité que le premier dé donne 6 ?`,c:[R`$\frac15$`,R`$\frac16$`,R`$\frac1{36}$`,R`$\frac5{36}$`],a:0,e:R`La somme vaut 8 pour 5 résultats équiprobables : $(2,6),(3,5),(4,4),(5,3),(6,2)$. Un seul commence par 6 : $\frac{1/36}{5/36}=\frac15$.`},
{t:"cond",q:R`Urne de 3 rouges et 2 blanches, deux tirages successifs sans remise ; $R_k$ : « la $k$-ième boule tirée est rouge ». $\mathbb P_{R_1}(R_2)=$`,c:[R`$\frac12$`,R`$\frac25$`,R`$\frac35$`,R`$\frac3{10}$`],a:0,e:R`Après une rouge, il reste 2 rouges sur 4 boules : $\frac24=\frac12$.`},
{t:"cond",q:R`Urne de 3 rouges et 2 blanches, tirages successifs sans remise ; $R_k$ : « la $k$-ième boule tirée est rouge ». $\mathbb P(R_1\cap R_2)=$`,c:[R`$\frac3{10}$`,R`$\frac9{25}$`,R`$\frac35$`,R`$\frac12$`],a:0,e:R`Probabilités composées : $\mathbb P(R_1)\,\mathbb P_{R_1}(R_2)=\frac35\times\frac24=\frac3{10}$. ($\frac9{25}$ serait le résultat avec remise.)`},
{t:"cond",q:R`Urne de 3 rouges et 2 blanches, trois tirages successifs sans remise. Probabilité d'obtenir trois rouges :`,c:[R`$\frac1{10}$`,R`$\frac{27}{125}$`,R`$\frac35$`,R`$\frac3{10}$`],a:0,e:R`$\mathbb P(R_1)\,\mathbb P_{R_1}(R_2)\,\mathbb P_{R_1\cap R_2}(R_3)=\frac35\times\frac24\times\frac13=\frac1{10}$.`},
{t:"cond",q:R`Formule des probabilités composées pour $\mathbb P(A\cap B\cap C)$ (avec $\mathbb P(A\cap B)\neq0$) :`,c:[R`$\mathbb P(A)\,\mathbb P_A(B)\,\mathbb P_{A\cap B}(C)$`,R`$\mathbb P(A)\,\mathbb P(B)\,\mathbb P(C)$`,R`$\mathbb P_A(B)\,\mathbb P_B(C)$`],a:0,e:R`$\mathbb P(A)\mathbb P(B)\mathbb P(C)$ n'est vrai que si $A$, $B$, $C$ sont mutuellement indépendants.`},
{t:"cond",q:"Dans un arbre de probabilités, le nombre écrit sur la branche qui va de A vers B est :",c:[R`$\mathbb P_A(B)$`,R`$\mathbb P(A\cap B)$`,R`$\mathbb P(B)$`],a:0,e:R`On obtient $\mathbb P(A\cap B)$ en multipliant le long du chemin : $\mathbb P(A)\times\mathbb P_A(B)$.`},
{t:"cond",q:"70 % des élèves d'un lycée sont demi-pensionnaires et, parmi eux, 40 % font du sport à l'AS. Probabilité qu'un élève pris au hasard soit demi-pensionnaire et fasse du sport à l'AS :",c:["0,28","0,4","0,7","1,1"],a:0,e:R`« Parmi eux, 40 % » est une probabilité conditionnelle : $\mathbb P(D\cap S)=\mathbb P(D)\,\mathbb P_D(S)=0{,}7\times0{,}4=0{,}28$.`},
{t:"fpt",q:R`Pour écrire $\mathbb P(B)=\sum_{i=1}^n\mathbb P(A_i)\,\mathbb P_{A_i}(B)$, il faut que $(A_1,\dots,A_n)$ soit :`,c:["un système complet d'événements non négligeables","deux à deux indépendants","un système complet, sans autre condition"],a:0,e:R`C'est la version ② du cours : il faut $\mathbb P(A_i)\neq0$ pour que les $\mathbb P_{A_i}$ soient définies.`},
{t:"fpt",q:R`$(A_1,\dots,A_n)$ est un système complet d'événements, sans autre hypothèse. Pour tout événement $B$ :`,c:[R`$\mathbb P(B)=\sum_{i=1}^n\mathbb P(A_i\cap B)$`,R`$\mathbb P(B)=\sum_{i=1}^n\mathbb P(A_i)\,\mathbb P_{A_i}(B)$`,R`$\mathbb P(B)=\sum_{i=1}^n\mathbb P_{A_i}(B)$`],a:0,e:R`Version ① du cours : $B=\bigcup_{i}(A_i\cap B)$, réunion disjointe. Elle ne demande pas $\mathbb P(A_i)\neq0$.`},
{t:"fpt",q:R`Un système complet contient un événement $A_k$ avec $\mathbb P(A_k)=0$. Peut-on utiliser une formule des probabilités totales ?`,c:[R`Oui, la version $\mathbb P(B)=\sum\mathbb P(A_i\cap B)$`,"Non, jamais",R`Oui, la version avec les $\mathbb P_{A_i}(B)$, telle quelle`],a:0,e:R`$\mathbb P_{A_k}$ n'est pas définie. La version ① marche toujours (ou bien on convient que $\mathbb P(A_k)\mathbb P_{A_k}(B)=0$).`},
{t:"fpt",q:R`Dire que $A$ est négligeable pour $\mathbb P$ signifie :`,c:[R`$\mathbb P(A)=0$`,R`$A=\varnothing$`,R`$\mathbb P(A)$ est petite`],a:0,e:R`Un événement négligeable n'est pas forcément vide. Un système complet « non négligeable » : tous les $\mathbb P(A_i)\neq0$.`},
{t:"fpt",q:R`$(A_1,\dots,A_n)$ est un système complet d'événements. $\sum_{i=1}^n\mathbb P(A_i)=$`,c:["1","n","0"],a:0,e:R`$\bigcup_{i=1}^n A_i=\Omega$ et $\forall (i,j)\in[\![1;n]\!]^2,\ i\neq j\Longrightarrow A_i\cap A_j=\varnothing$, donc $\sum_{i=1}^n\mathbb P(A_i)=\mathbb P(\Omega)=1$.`},
{t:"fpt",q:R`Pour la formule de Bayes $\mathbb P_B(A_j)=\dfrac{\mathbb P(A_j)\mathbb P_{A_j}(B)}{\sum_i\mathbb P(A_i)\mathbb P_{A_i}(B)}$, il faut :`,c:[R`un système complet non négligeable, et $B$ non négligeable`,R`seulement $\mathbb P(B)\neq0$`,R`$A_j$ et $B$ indépendants`],a:0,e:R`$\mathbb P(A_i)\neq0$ pour définir les $\mathbb P_{A_i}$, et $\mathbb P(B)\neq0$ pour définir $\mathbb P_B$.`},
{t:"fpt",q:R`$(A,\overline A)$ est un système complet d'événements :`,c:["toujours","seulement si A est indépendant de B",R`seulement si $\mathbb P(A)=\frac12$`],a:0,e:R`$A\cup\overline A=\Omega$ et $A\cap\overline A=\varnothing$. Pour la version avec $\mathbb P_A(B)$ et $\mathbb P_{\overline A}(B)$, il faut en plus $\mathbb P(A)\neq0$ et $\mathbb P(\overline A)\neq0$.`},
{t:"fpt",q:R`Pièce équilibrée. Pile : on tire dans l'urne A (3 blanches, 1 noire). Face : urne B (1 blanche, 3 noires). $\mathbb P(\text{blanche})=$`,c:[R`$\frac12$`,R`$\frac34$`,R`$\frac14$`,R`$\frac38$`],a:0,e:R`Notons $P$ : « la pièce donne Pile » et $F$ : « la pièce donne Face ». $(P,F)$ est un système complet, $\mathbb P(P)=\mathbb P(F)=\frac12\neq0$ : $\frac12\times\frac34+\frac12\times\frac14=\frac12$.`},
{t:"fpt",q:R`Pièce équilibrée. Pile : on tire dans l'urne A (3 blanches, 1 noire). Face : urne B (1 blanche, 3 noires). Sachant que la boule est blanche, $\mathbb P(\text{Pile})=$`,c:[R`$\frac34$`,R`$\frac38$`,R`$\frac12$`],a:0,e:R`Notons $P$ : « la pièce donne Pile » et $Bl$ : « la boule tirée est blanche ». $\mathbb P_{Bl}(P)=\dfrac{\mathbb P(P\cap Bl)}{\mathbb P(Bl)}=\dfrac{3/8}{1/2}=\dfrac34$.`},
{t:"fpt",q:"Quelle est la bonne formule ?",c:[R`$\mathbb P(B)=\sum_i\mathbb P(A_i)\,\mathbb P_{A_i}(B)$`,R`$\mathbb P(B)=\sum_i\mathbb P_{A_i}(B)$`,R`$\mathbb P(B)=\sum_i\mathbb P(A_i)\,\mathbb P_{B}(A_i)$`],a:0,e:R`Chaque $\mathbb P_{A_i}(B)$ est pondéré par $\mathbb P(A_i)$.`},
{t:"fpt",q:"« On choisit une urne au hasard, puis on tire une boule. » Le système complet naturel porte sur :",c:["le choix de l'urne","la couleur de la boule","le nombre de boules"],a:0,e:"Le système complet décrit ce qui se passe en premier."},
{t:"fpt",q:R`Quel lien entre $\mathbb P(A\cap B)$ et $\mathbb P_A(B)$ (avec $\mathbb P(A)\neq0$) ?`,c:[R`$\mathbb P(A\cap B)=\mathbb P(A)\,\mathbb P_A(B)$`,"ce sont les mêmes",R`$\mathbb P_A(B)=\mathbb P(A)\,\mathbb P(A\cap B)$`],a:0,e:R`Définition : $\mathbb P_A(B)=\dfrac{\mathbb P(A\cap B)}{\mathbb P(A)}$.`},
{t:"fpt",q:R`Une maladie touche 1 % d'une population. Un test est positif chez 99 % des malades et chez 2 % des non-malades. Probabilité qu'un test soit positif :`,c:["0,0297","0,99","0,0198","0,01"],a:0,e:R`Notons $M$ : « l'individu est malade » et $T$ : « le test est positif ». $(M,\overline M)$ est un système complet, $\mathbb P(M)=0{,}01\neq0$, $\mathbb P(\overline M)=0{,}99\neq0$ : $0{,}01\times0{,}99+0{,}99\times0{,}02=0{,}0297$.`},
{t:"fpt",q:R`Une maladie touche 1 % d'une population. Un test est positif chez 99 % des malades et chez 2 % des non-malades. Le test d'un individu est positif : probabilité qu'il soit malade ?`,c:[R`$\frac13$`,"0,99","0,01","0,0297"],a:0,e:R`Notons $M$ : « l'individu est malade » et $T$ : « le test est positif ». $\mathbb P_T(M)=\dfrac{\mathbb P(M\cap T)}{\mathbb P(T)}=\dfrac{0{,}0099}{0{,}0297}=\dfrac13$. Seulement une chance sur trois !`},
{t:"fpt",q:R`Urnes $U_1$ (1 rouge, 3 blanches), $U_2$ (2 rouges, 2 blanches), $U_3$ (3 rouges, 1 blanche). On choisit une urne au hasard, puis on tire une boule. $\mathbb P(R)=$`,c:[R`$\frac12$`,R`$\frac32$`,R`$\frac13$`,R`$\frac14$`],a:0,e:R`$(U_1,U_2,U_3)$ est un système complet, $\mathbb P(U_i)=\frac13\neq0$ : $\frac13\left(\frac14+\frac24+\frac34\right)=\frac12$.`},
{t:"fpt",q:R`Urnes $U_1$ (1 rouge, 3 blanches), $U_2$ (2 rouges, 2 blanches), $U_3$ (3 rouges, 1 blanche) ; on choisit une urne au hasard, puis on tire une boule. Un élève écrit $\mathbb P(R)=\mathbb P_{U_1}(R)+\mathbb P_{U_2}(R)+\mathbb P_{U_3}(R)$. Son erreur :`,c:[R`il manque les poids $\mathbb P(U_i)$`,"il fallait multiplier au lieu d'additionner","il n'y a pas d'erreur"],a:0,e:R`Il trouverait $\frac64=\frac32>1$ : impossible pour une probabilité.`},
{t:"dist",q:R`Une usine a deux machines : $M_1$ fabrique 60 % des pièces, $M_2$ 40 %. 5 % des pièces de $M_1$ et 10 % des pièces de $M_2$ sont défectueuses ($D$). Pour calculer $\mathbb P(M_1\cap D)$, on utilise :`,c:["la formule des probabilités composées","la formule des probabilités totales"],a:0,e:R`C'est une intersection, un seul chemin de l'arbre : $\mathbb P(M_1\cap D)=\mathbb P(M_1)\,\mathbb P_{M_1}(D)=0{,}6\times0{,}05=0{,}03$.`},
{t:"dist",q:R`Une usine a deux machines : $M_1$ fabrique 60 % des pièces, $M_2$ 40 %. 5 % des pièces de $M_1$ et 10 % des pièces de $M_2$ sont défectueuses ($D$). Pour calculer $\mathbb P(D)$, la probabilité qu'une pièce prise au hasard soit défectueuse, on utilise :`,c:["la formule des probabilités totales","la formule des probabilités composées"],a:0,e:R`Deux chemins mènent à $D$ (par $M_1$ et par $M_2$) : $(M_1,M_2)$ est un système complet non négligeable, et $\mathbb P(D)=0{,}6\times0{,}05+0{,}4\times0{,}1=0{,}07$.`},
{t:"dist",q:R`Une usine a deux machines : $M_1$ fabrique 60 % des pièces, $M_2$ 40 %. 5 % des pièces de $M_1$ et 10 % des pièces de $M_2$ sont défectueuses ($D$). $\mathbb P(D)=$`,c:["0,07","0,03","0,15","0,075"],a:0,e:R`$0{,}03+0{,}04=0{,}07$. 0,03 ne garde que le chemin par $M_1$ ; 0,15 oublie les poids ; 0,075 est une moyenne non pondérée.`},
{t:"dist",q:R`Une usine a deux machines : $M_1$ fabrique 60 % des pièces, $M_2$ 40 %. 5 % des pièces de $M_1$ et 10 % des pièces de $M_2$ sont défectueuses ($D$). Un élève écrit : « $\mathbb P(D)=\mathbb P(M_1)\,\mathbb P_{M_1}(D)=0{,}03$ ». Son erreur :`,c:[R`il n'a gardé que le chemin passant par $M_1$`,"il aurait dû additionner au lieu de multiplier","il n'y a pas d'erreur"],a:0,e:R`$\mathbb P(M_1)\,\mathbb P_{M_1}(D)$ vaut $\mathbb P(M_1\cap D)$, pas $\mathbb P(D)$. Il manque le terme $\mathbb P(M_2)\,\mathbb P_{M_2}(D)$.`},
{t:"dist",q:R`Une usine a deux machines : $M_1$ fabrique 60 % des pièces, $M_2$ 40 %. 5 % des pièces de $M_1$ et 10 % des pièces de $M_2$ sont défectueuses ($D$). Sans calcul : $\mathbb P(D)$ est forcément :`,c:["entre 0,05 et 0,1","inférieure à 0,05","supérieure à 0,1"],a:0,e:R`$\mathbb P(D)=0{,}6\times0{,}05+0{,}4\times0{,}1$ est une moyenne pondérée de $0{,}05$ et $0{,}1$. C'est un bon moyen de contrôler un résultat.`},
{t:"dist",q:"Sur un arbre, la formule des probabilités composées revient à :",c:["multiplier les probabilités le long d'un chemin","additionner les probabilités de plusieurs chemins","lire la probabilité sur une seule branche"],a:0,e:R`$\mathbb P(A_1\cap\dots\cap A_n)$ est le produit des probabilités portées par les branches du chemin.`},
{t:"dist",q:"Sur un arbre, la formule des probabilités totales revient à :",c:["additionner les probabilités de tous les chemins qui mènent à B","multiplier les probabilités le long d'un chemin","lire la probabilité sur la dernière branche"],a:0,e:R`Chaque chemin qui mène à $B$ a pour probabilité $\mathbb P(A_i)\,\mathbb P_{A_i}(B)$, et $\mathbb P(B)$ est leur somme.`},
{t:"dist",q:R`Dans la formule des probabilités totales, chaque terme $\mathbb P(A_i)\times\mathbb P_{A_i}(B)$ est égal à :`,c:[R`$\mathbb P(A_i\cap B)$, par les probabilités composées`,R`$\mathbb P(B)$`,R`$\mathbb P_{A_i}(B)$`],a:0,e:"Les deux formules travaillent ensemble : les composées donnent chaque chemin, les totales en font la somme."},
{t:"dist",q:R`Urne de 3 rouges et 2 blanches, deux tirages successifs sans remise ; $R_k$ : « la $k$-ième boule tirée est rouge ». Pour $\mathbb P(R_1\cap R_2)$, on utilise :`,c:["les probabilités composées","les probabilités totales"],a:0,e:R`$\mathbb P(R_1\cap R_2)=\mathbb P(R_1)\,\mathbb P_{R_1}(R_2)=\frac35\times\frac24=\frac3{10}$.`},
{t:"dist",q:R`Urne de 3 rouges et 2 blanches, tirages successifs sans remise ; $R_k$ : « la $k$-ième boule tirée est rouge ». Pour $\mathbb P(R_2)$, on utilise :`,c:[R`les probabilités totales, avec le système complet $(R_1,\overline{R_1})$`,"les probabilités composées seules",R`$\mathbb P(R_2)=\mathbb P_{R_1}(R_2)$`],a:0,e:"On ne sait rien de la 1re boule : deux chemins mènent à R₂."},
{t:"dist",q:R`Urne de 3 rouges et 2 blanches, tirages successifs sans remise ; $R_k$ : « la $k$-ième boule tirée est rouge ». $\mathbb P(R_2)=$`,c:[R`$\frac35$`,R`$\frac3{10}$`,R`$\frac12$`],a:0,e:R`$\mathbb P(R_1)\mathbb P_{R_1}(R_2)+\mathbb P(\overline{R_1})\mathbb P_{\overline{R_1}}(R_2)=\frac35\times\frac24+\frac25\times\frac34=\frac{6}{20}+\frac{6}{20}=\frac35$. Même probabilité qu'au 1er tirage.`},
{t:"dist",q:R`Urne de 3 rouges et 2 blanches, trois tirages successifs sans remise. Pour la probabilité que les trois boules soient rouges, on utilise :`,c:["les probabilités composées, avec trois facteurs","les probabilités totales","les deux formules ensemble"],a:0,e:R`$\mathbb P(R_1\cap R_2\cap R_3)=\frac35\times\frac24\times\frac13=\frac1{10}$ : un seul chemin.`},
{t:"dist",q:R`Hypothèse de la formule des probabilités composées pour $\mathbb P(A_1\cap A_2\cap A_3)$ :`,c:[R`$\mathbb P(A_1\cap A_2)\neq0$`,R`$(A_1,A_2,A_3)$ est un système complet d'événements`,R`$A_1$, $A_2$, $A_3$ sont indépendants`],a:0,e:R`Il faut que les probabilités conditionnelles $\mathbb P_{A_1}$ et $\mathbb P_{A_1\cap A_2}$ soient définies. Aucun système complet n'est demandé.`},
{t:"dist",q:R`Hypothèse de la formule $\mathbb P(B)=\sum_{i=1}^n\mathbb P(A_i)\,\mathbb P_{A_i}(B)$ :`,c:[R`$(A_1,\dots,A_n)$ est un système complet d'événements non négligeables`,R`$\mathbb P(A_1\cap\dots\cap A_{n-1})\neq0$`,R`les $A_i$ sont indépendants`],a:0,e:"C'est l'hypothèse des probabilités totales (version ②). Celle des probabilités composées est différente."},

const LETTRES="ABCDEF";
/* Ordre des réponses fixé par l'identifiant de la question : le même sur tous les téléphones. */
function fixedOrder(q){let s=0;for(let i=0;i<q.id.length;i++)s=(s*31+q.id.charCodeAt(i))>>>0;
  const rnd=()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296};
  const a=q.c.map((c,k)=>({c,k}));for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function letterOf(q){return LETTRES[fixedOrder(q).findIndex(o=>o.k===q.a)]}

const LEN=10;
let best=store.get("ap_best",{});      // meilleure note par thème (sur 10)
let missed=store.get("ap_missed",[]);  // ids des questions ratées, à revoir
let hist=store.get("ap_hist",[]);      // dernières séries
missed=missed.filter(id=>QBYID[id]);
let quiz={mode:"home",theme:"all",list:[],i:0,pts:0,res:[],answered:false};

function startSerie(theme,review){
  let ids;
  if(review){ids=shuffle(missed).slice(0,LEN)}
  else{const pool=Q.filter(q=>theme==="all"||q.t===theme).map(q=>q.id);ids=shuffle(pool).slice(0,LEN)}
  if(!ids.length)return;
  quiz={mode:"play",theme:review?"review":theme,list:ids,i:0,pts:0,res:[],answered:false};renderQuiz();
}
function startClasse(n){
  const c=CLASSE[n];if(!c)return;
  const ids=c.ids.filter(id=>QBYID[id]);if(!ids.length)return;
  quiz={mode:"play",theme:"classe",classe:n,list:ids,i:0,pts:0,res:[],answered:false};renderQuiz();
  window.scrollTo(0,0);
}
function renderQuiz(){
  const v=document.getElementById("v-quiz");
  if(quiz.mode==="home")return renderHome(v);
  if(quiz.mode==="end")return renderEnd(v);
  renderPlay(v);
}
function renderHome(v){
  const chips=["all",...Object.keys(THEMES)];
  const total=hist.reduce((s,h)=>s+h.pts,0);
  v.innerHTML=`<div class="panel"><div class="eyebrow">Quiz</div><h2>Une série de ${LEN} questions</h2>
  <p class="lead">Un point par bonne réponse. Chaque réponse est corrigée et expliquée, avec le rappel de cours à côté. Les questions ratées sont gardées pour être rejouées.</p>
  <h3 style="margin-bottom:8px">Choisir un thème</h3>
  <div class="chips" role="group" aria-label="Thème">${chips.map(k=>`<button type="button" data-th="${k}" aria-pressed="${quiz.theme===k}">${k==="all"?"Tout mélanger":THEMES[k]}</button>`).join("")}</div>
  <div class="row" style="margin-top:16px"><button type="button" class="primary" id="go">Commencer la série</button>
  <button type="button" id="rev" ${missed.length?"":"disabled"}>Rejouer mes erreurs (${missed.length})</button></div></div>
  <div class="panel"><div class="eyebrow">En classe</div><h2>Quiz numérotés</h2>
  <p class="lead">Ouvrir le quiz dont le numéro est donné en classe. Tout le monde a les mêmes questions, dans le même ordre, avec les réponses repérées par A, B, C, D. Ces quiz mélangent les chapitres et se font sans brouillon.</p>
  <div class="classgrid">${CLASSE.map((c,i)=>`<button type="button" data-cl="${i}"><b>N°${i+1}</b></button>`).join("")}</div></div>
  <div class="panel"><div class="row spread"><h3>Mes résultats</h3><span class="pill">${total} points au total · ${hist.length} série${hist.length>1?"s":""}</span></div>
  <p class="small" style="margin:.3em 0 10px">Meilleure note par thème, sur ${LEN}. Les résultats restent sur cet appareil.</p>
  <div class="grid2">${["all",...Object.keys(THEMES)].map(k=>{const b=best[k];return `<div class="stat"><div class="row spread"><span>${k==="all"?"Tout mélanger":THEMES[k]}</span><span style="font-variant-numeric:tabular-nums">${b===undefined?"—":b+"/"+LEN}</span></div><div class="bar"><i style="width:${b?100*b/LEN:0}%"></i></div></div>`}).join("")}</div>
  <div class="row" style="margin-top:14px"><button type="button" id="reset">Effacer mes résultats</button><span class="small" id="resetMsg"></span></div></div>`;
  v.querySelector(".chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;quiz.theme=b.dataset.th;renderHome(v)};
  v.querySelector("#go").onclick=()=>startSerie(quiz.theme==="review"?"all":quiz.theme,false);
  v.querySelector("#rev").onclick=()=>startSerie(null,true);
  v.querySelector(".classgrid").onclick=e=>{const b=e.target.closest("button");if(!b)return;startClasse(+b.dataset.cl)};
  const rs=v.querySelector("#reset");let armed=false;
  rs.onclick=()=>{if(!armed){armed=true;rs.textContent="Confirmer l'effacement";v.querySelector("#resetMsg").textContent="Notes, points et erreurs à revoir seront effacés.";return}
    best={};missed=[];hist=[];store.set("ap_best",best);store.set("ap_missed",missed);store.set("ap_hist",hist);renderHome(v)};
}
function renderPlay(v){
  const q=QBYID[quiz.list[quiz.i]];quiz.answered=false;
  const cl=quiz.theme==="classe";
  const ch=cl?fixedOrder(q):shuffle(q.c.map((c,k)=>({c,k})));
  const dots=quiz.list.map((_,j)=>`<i class="${j<quiz.res.length?(quiz.res[j]?"ok":"ko"):(j===quiz.i?"cur":"")}"></i>`).join("");
  v.innerHTML=`${cl?`<div class="classbar">Quiz en classe <b>n°${quiz.classe+1}</b></div>`:""}<div class="panel"><div class="hud"><span class="pill">Question ${quiz.i+1}/${quiz.list.length}</span><div class="dots" aria-hidden="true">${dots}</div><span class="pill" id="pts">${quiz.pts} pt${quiz.pts>1?"s":""}</span></div>
  <div class="eyebrow" style="margin-top:14px">${THEMES[q.t]}${quiz.theme==="review"?" · erreur à revoir":""}</div>
  <div class="qtext">${q.q}</div>
  <div class="choices">${ch.map((o,i)=>`<button type="button" data-k="${o.k}">${cl?`<b class="lettre">${LETTRES[i]}</b>`:""}${o.c}</button>`).join("")}</div>
  <div id="after"></div></div>
  <div class="row"><button type="button" id="quit">Abandonner la série</button></div>`;
  v.querySelector("#quit").onclick=()=>{quiz.mode="home";quiz.theme="all";renderQuiz()};
  if(cl)v.querySelector("#quit").textContent="Quitter ce quiz";
  v.querySelector(".choices").onclick=e=>{
    const b=e.target.closest("button");if(!b||quiz.answered)return;quiz.answered=true;
    const ok=+b.dataset.k===q.a;quiz.res.push(ok);if(ok)quiz.pts++;
    v.querySelectorAll(".choices button").forEach(x=>{if(+x.dataset.k===q.a)x.classList.add("good");else if(x===b)x.classList.add("bad");x.disabled=true});
    if(ok)missed=missed.filter(id=>id!==q.id);else if(!missed.includes(q.id))missed.push(q.id);
    store.set("ap_missed",missed);
    v.querySelector("#pts").textContent=quiz.pts+" pt"+(quiz.pts>1?"s":"");
    v.querySelectorAll(".dots i")[quiz.i].className=ok?"ok":"ko";
    const last=quiz.i===quiz.list.length-1;
    const af=v.querySelector("#after");
    af.innerHTML=`<div class="expl"><span class="verdict ${ok?"okv":"kov"}">${ok?"Exact : +1 point.":"Non."}</span>${cl?` Bonne réponse : <b>${letterOf(q)}</b>.`:""} ${q.e}</div>
    <div class="row" style="margin-top:12px"><button type="button" class="primary" id="next">${last?"Voir ma note":"Question suivante"}</button><button type="button" id="rap" aria-expanded="false">Rappel de cours</button></div>
    <div class="rappel" id="rapbox" hidden>${RAPPEL[q.t]}</div>`;
    tex(af);
    af.querySelector("#rap").onclick=ev=>{const r=af.querySelector("#rapbox");r.hidden=!r.hidden;ev.target.setAttribute("aria-expanded",String(!r.hidden))};
    af.querySelector("#next").onclick=()=>{if(last)finish();else{quiz.i++;renderQuiz()}};
    af.querySelector("#next").focus();
  };
  tex(v);
}
function finish(){
  quiz.mode="end";
  const n=quiz.list.length;
  if(quiz.theme!=="review"&&quiz.theme!=="classe"&&n===LEN){if(best[quiz.theme]===undefined||quiz.pts>best[quiz.theme])best[quiz.theme]=quiz.pts;store.set("ap_best",best)}
  hist.push({th:quiz.theme,pts:quiz.pts,n,d:Date.now()});if(hist.length>200)hist=hist.slice(-200);store.set("ap_hist",hist);
  renderQuiz();
}
function renderEnd(v){
  const n=quiz.list.length,p=quiz.pts;
  const msg=p===n?"Tout juste. Passe à un autre thème, ou reviens dans quelques jours pour vérifier que c'est su.":p>=0.7*n?"Bien. Rejoue tes erreurs pour finir le travail.":p>=0.4*n?"C'est un début. Ouvre le rappel de cours du thème, puis rejoue tes erreurs.":"Ce thème n'est pas encore su. Commence par les fiches « Cours à savoir », puis refais une série.";
  const wrong=quiz.list.filter((id,j)=>!quiz.res[j]).map(id=>QBYID[id]);
  const cl=quiz.theme==="classe";
  const label=cl?`Quiz en classe n°${quiz.classe+1}`:quiz.theme==="review"?"Erreurs à revoir":quiz.theme==="all"?"Tout mélanger":THEMES[quiz.theme];
  v.innerHTML=`<div class="panel"><div class="eyebrow">${label}</div><div class="row" style="gap:18px;align-items:flex-end;margin-top:6px"><span class="note">${p}/${n}</span>
  <p style="margin:0;max-width:52ch">${msg}</p></div>
  <div class="row" style="margin-top:16px"><button type="button" class="primary" id="again">${cl?"Refaire ce quiz":"Nouvelle série"}</button><button type="button" id="rev" ${missed.length?"":"disabled"}>Rejouer mes erreurs (${missed.length})</button><button type="button" id="home">Accueil du quiz</button></div></div>
  ${wrong.length?`<div class="panel"><h3>Les questions ratées</h3><ul class="missed" style="margin-top:10px">${wrong.map(q=>`<li><div>${q.q}</div><div class="good-ans">Réponse : ${cl?letterOf(q)+". ":""}${q.c[q.a]}</div></li>`).join("")}</ul></div>`:""}`;
  v.querySelector("#again").onclick=()=>cl?startClasse(quiz.classe):startSerie(quiz.theme==="review"?"all":quiz.theme,false);
  v.querySelector("#rev").onclick=()=>startSerie(null,true);
  v.querySelector("#home").onclick=()=>{quiz.mode="home";if(quiz.theme==="review"||cl)quiz.theme="all";renderQuiz()};
  tex(v);
}

const CARDS=[
{id:"c1",t:"res",r:"Qu'est-ce que l'univers ? un résultat ?",v:R`L'univers $\Omega$ est l'ensemble des résultats possibles. Un résultat est un élément $\omega$ de $\Omega$ : $\omega\in\Omega$.`},
{id:"c2",t:"res",r:"Qu'est-ce qu'un événement ?",v:R`Une partie $A$ de $\Omega$ : $A\in\mathscr P(\Omega)$. Les événements élémentaires sont les singletons $\{\omega\}$.`},
{id:"c31",t:"res",r:R`Probabilité d'un événement $A$ en situation d'équiprobabilité ?`,v:R`$\mathbb P(A)=\dfrac{\operatorname{card}(A)}{\operatorname{card}(\Omega)}=\dfrac{\text{nombre de cas favorables}}{\text{nombre de cas possibles}}$.`},
{id:"c3",t:"par",r:R`Que signifie « $A$ est une partie de $E$ » ?`,v:R`Tout élément de $A$ est un élément de $E$ ; on note $A\subset E$.`},
{id:"c4",t:"par",r:R`$\operatorname{card}\big(\mathscr P(E)\big)$ si $\operatorname{card}(E)=n$ ? Pourquoi ?`,v:R`$2^n$. ① Les $\mathscr P_p(E)$ (ensembles des parties de $E$ à $p$ éléments), $0\leqslant p\leqslant n$, forment une partition de $\mathscr P(E)$ : $\sum_{p=0}^n\binom np=2^n$. ② Bijection entre $\mathscr P(E)$ et $\{0;1\}^n$ : $x_i=1$ si $e_i\in A$, $0$ sinon.`},
{id:"c39",t:"indic",r:R`Définition de la fonction indicatrice $\mathbf 1_A$ d'une partie $A$ de $E$.`,v:R`L'application de $E$ dans $\{0,1\}$ qui à $x$ associe $1$ si $x\in A$ et $0$ sinon.`},
{id:"c40",t:"indic",r:R`$\mathbf 1_{A\cap B}$ et $\mathbf 1_{\overline A}$ en fonction de $\mathbf 1_A$ et $\mathbf 1_B$ ?`,v:R`$\mathbf 1_{A\cap B}=\mathbf 1_A\times\mathbf 1_B$ et $\mathbf 1_{\overline A}=1-\mathbf 1_A$.`},
{id:"c41",t:"indic",r:R`Traduire $A=B$ et $A\subset B$ avec les indicatrices. Que valent $\mathbf 1_\varnothing$ et $\mathbf 1_E$ ?`,v:R`$\mathbf 1_A=\mathbf 1_B\iff A=B$ ; $\mathbf 1_A\leqslant\mathbf 1_B\iff A\subset B$. $\mathbf 1_\varnothing=0$ et $\mathbf 1_E=1$.`},
{id:"c42",t:"indic",r:R`Cardinal de $A$, puis de $A\cap B$, à l'aide d'indicatrices ($E$ fini).`,v:R`$\operatorname{card}(A)=\sum_{x\in E}\mathbf 1_A(x)$ et $\operatorname{card}(A\cap B)=\sum_{x\in A}\mathbf 1_B(x)$.`},
{id:"c43",t:"indic",r:R`Loi, espérance et variance de $\mathbf 1_A$ si $A$ est un événement ?`,v:R`$\mathbf 1_A\hookrightarrow\mathcal B\big(\mathbb P(A)\big)$, $\mathbb E(\mathbf 1_A)=\mathbb P(A)$, $V(\mathbf 1_A)=\mathbb P(A)\big(1-\mathbb P(A)\big)$.`},
{id:"c5",t:"den",r:R`Nombre de $p$-listes d'un ensemble à $n$ éléments ? Situation type ?`,v:R`$n^p$. Tirages successifs avec remise.`},
{id:"c6",t:"den",r:R`$E$ est un ensemble de cardinal $n$ et $p\leqslant n$. Nombre de $p$-listes sans répétition de $E$ ? Situation type ?`,v:R`$n(n-1)\cdots(n-p+1)$ ($p$ facteurs), soit $\dfrac{n!}{(n-p)!}$. Tirages successifs sans remise.`},
{id:"c7",t:"den",r:R`Qu'est-ce qu'une permutation de $E$ ? Combien y en a-t-il si $\operatorname{card}(E)=n$ ?`,v:R`Une liste contenant exactement une fois chaque élément de $E$. Il y en a $n!$.`},
{id:"c8",t:"den",r:R`$E$ est un ensemble de cardinal $n$ et $p\leqslant n$. Qu'est-ce qu'une $p$-combinaison de $E$ ? Combien y en a-t-il ? Situation type ?`,v:R`Une partie de $E$ à $p$ éléments. Il y en a $\dfrac1{p!}\,n(n-1)\cdots(n-p+1)=\dbinom np$. Tirage simultané.`},
{id:"c9",t:"den",r:"Formule du crible pour deux ensembles ?",v:R`$\operatorname{card}(A\cup B)=\operatorname{card}(A)+\operatorname{card}(B)-\operatorname{card}(A\cap B)$`},
{id:"c10",t:"ind",r:R`Définition : $A$ et $B$ incompatibles.`,v:R`$A\cap B=\varnothing$.`},
{id:"c11",t:"ind",r:R`Définition : $A$ et $B$ indépendants.`,v:R`$\mathbb P(A\cap B)=\mathbb P(A)\,\mathbb P(B)$.`},
{id:"c12",t:"ind",r:R`Définition : $A_1,\dots,A_n$ mutuellement indépendants.`,v:R`Pour toute partie $J$ de $[\![1;n]\!]$ : $\mathbb P\Big(\bigcap_{j\in J}A_j\Big)=\prod_{j\in J}\mathbb P(A_j)$. Mutuellement entraîne 2 à 2 ; la réciproque est fausse.`},
{id:"c32",t:"ind",r:R`$A$ et $B$ sont indépendants. Que dire de $A$ et $\overline B$ ? de $\overline A$ et $\overline B$ ?`,v:R`Ils sont aussi indépendants : $A$ et $B$ indépendants équivaut à $A$ et $\overline B$ indépendants, à $\overline A$ et $B$ indépendants, à $\overline A$ et $\overline B$ indépendants.`},
{id:"c13",t:"fpt",r:R`Définition : $(A_1,\dots,A_n)$ système complet d'événements.`,v:R`① $\bigcup_{k=1}^n A_k=\Omega$ ; ② $\forall (i,j)\in[\![1;n]\!]^2,\ i\neq j\Longrightarrow A_i\cap A_j=\varnothing$.`},
{id:"c14",t:"cond",r:R`Définition de la probabilité sachant $A$.`,v:R`Si $\mathbb P(A)\neq0$, l'application $\mathbb P_A:B\mapsto\dfrac{\mathbb P(A\cap B)}{\mathbb P(A)}$ est une probabilité sur $\big(\Omega,\mathscr P(\Omega)\big)$. On note aussi $\mathbb P(B\,|\,A)$.`},
{id:"c15",t:"fpt",r:"Formule des probabilités totales : les deux versions (hypothèses et conclusion).",v:R`① Si $(A_1,\dots,A_n)$ est un système complet d'événements, alors pour tout $B$ : $\mathbb P(B)=\sum_{i=1}^n\mathbb P(A_i\cap B)$.<br>② Si $(A_1,\dots,A_n)$ est un système complet d'événements non négligeables ($\mathbb P(A_i)\neq0$ pour tout $i$), alors pour tout $B$ : $\mathbb P(B)=\sum_{i=1}^n\mathbb P(A_i)\times\mathbb P_{A_i}(B)$.`},
{id:"c33",t:"fpt",r:R`Que vaut $\sum_{i=1}^n\mathbb P(A_i)$ si $(A_1,\dots,A_n)$ est un système complet d'événements ? Que signifie « $A$ négligeable » ?`,v:R`$\sum_{i=1}^n\mathbb P(A_i)=1$. $A$ est négligeable si $\mathbb P(A)=0$.`},
{id:"c16",t:"cond",r:"Formule des probabilités composées.",v:R`Si $\mathbb P(A_1\cap\dots\cap A_{n-1})\neq0$ : $\mathbb P(A_1\cap\dots\cap A_n)=\mathbb P(A_1)\,\mathbb P_{A_1}(A_2)\cdots\mathbb P_{A_1\cap\dots\cap A_{n-1}}(A_n)$.`},
{id:"c25",t:"cond",r:R`$\mathbb P_A$ est-elle une probabilité ? Conséquence pour $\mathbb P_A(\overline B)$ ?`,v:R`Oui : si $\mathbb P(A)\neq0$, $B\mapsto\mathbb P_A(B)$ est une probabilité. Donc $\mathbb P_A(\overline B)=1-\mathbb P_A(B)$. Attention : $\mathbb P_{\overline A}(B)$ n'est pas $1-\mathbb P_A(B)$.`},
{id:"c26",t:"cond",r:R`Lien entre indépendance et probabilité conditionnelle (avec $\mathbb P(A)\neq0$) ?`,v:R`Conséquence de la définition : $A$ et $B$ sont indépendants si et seulement si $\mathbb P_A(B)=\mathbb P(B)$.`},
{id:"c17",t:"fpt",r:"Formule de Bayes (hypothèses et conclusion).",v:R`Si $(A_1,\dots,A_n)$ est un système complet d'événements non négligeables et $B$ un événement non négligeable, alors pour tout $j$ : $\mathbb P_B(A_j)=\dfrac{\mathbb P(A_j)\times\mathbb P_{A_j}(B)}{\sum_{i=1}^n\mathbb P(A_i)\times\mathbb P_{A_i}(B)}$.`},
{id:"c44",t:"dist",r:"Probabilités composées ou probabilités totales : comment choisir ?",v:R`Composées : probabilité d'une intersection, un seul chemin de l'arbre, on multiplie. Totales : probabilité d'un événement atteint par plusieurs chemins, on additionne les chemins. Chaque terme $\mathbb P(A_i)\mathbb P_{A_i}(B)$ des totales se calcule par les composées.`},
{id:"c55",t:"dist",r:R`$\mathbb P(A)\times\mathbb P_A(B)$ : probabilités totales ou composées ? Que calcule-t-on ?`,v:R`Probabilités <b>composées</b>. On obtient $\mathbb P(A\cap B)$ (avec $\mathbb P(A)\neq0$).`},
{id:"c56",t:"dist",r:R`$\mathbb P(A_1)\,\mathbb P_{A_1}(A_2)\,\mathbb P_{A_1\cap A_2}(A_3)$ : probabilités totales ou composées ? Que calcule-t-on ?`,v:R`Probabilités <b>composées</b>. On obtient $\mathbb P(A_1\cap A_2\cap A_3)$ (avec $\mathbb P(A_1\cap A_2)\neq0$).`},
{id:"c57",t:"dist",r:R`$\sum_{i=1}^n\mathbb P(A_i)\,\mathbb P_{A_i}(B)$ : probabilités totales ou composées ? Que calcule-t-on ?`,v:R`Probabilités <b>totales</b>. On obtient $\mathbb P(B)$, si $(A_1,\dots,A_n)$ est un système complet d'événements non négligeables.`},
{id:"c58",t:"dist",r:R`$\mathbb P(A)\,\mathbb P_A(B)+\mathbb P(\overline A)\,\mathbb P_{\overline A}(B)$ : probabilités totales ou composées ? Que calcule-t-on ?`,v:R`Probabilités <b>totales</b>, avec le système complet $(A,\overline A)$. On obtient $\mathbb P(B)$ (avec $\mathbb P(A)\neq0$ et $\mathbb P(\overline A)\neq0$).`},
{id:"c59",t:"dist",r:R`$\sum_{i=1}^n\mathbb P(A_i\cap B)$ : probabilités totales ou composées ? Que calcule-t-on ?`,v:R`Probabilités <b>totales</b>, version ①. On obtient $\mathbb P(B)$ dès que $(A_1,\dots,A_n)$ est un système complet d'événements.`},
{id:"c60",t:"dist",r:R`Urne de 3 rouges et 2 blanches, tirages sans remise. Calcul : $\frac35\times\frac24\times\frac13$. Probabilités totales ou composées ? Que calcule-t-on ?`,v:R`Probabilités <b>composées</b>. On obtient $\mathbb P(R_1\cap R_2\cap R_3)=\frac1{10}$, la probabilité de tirer trois rouges.`},
{id:"c61",t:"dist",r:R`Usine : $M_1$ fabrique 60 % des pièces, $M_2$ 40 % ; 5 % des pièces de $M_1$ et 10 % de celles de $M_2$ sont défectueuses. Calcul : $0{,}6\times0{,}05+0{,}4\times0{,}1$. Probabilités totales ou composées ? Que calcule-t-on ?`,v:R`Probabilités <b>totales</b> avec le système complet $(M_1,M_2)$. On obtient $\mathbb P(D)=0{,}07$, la probabilité qu'une pièce prise au hasard soit défectueuse.`},
{id:"c62",t:"dist",r:R`Usine : $M_1$ fabrique 60 % des pièces, $M_2$ 40 % ; 5 % des pièces de $M_1$ et 10 % de celles de $M_2$ sont défectueuses. Calcul : $0{,}6\times0{,}05$. Probabilités totales ou composées ? Que calcule-t-on ?`,v:R`Probabilités <b>composées</b>. On obtient $\mathbb P(M_1\cap D)=0{,}03$, la probabilité qu'une pièce vienne de $M_1$ <b>et</b> soit défectueuse. Ce n'est pas $\mathbb P(D)$.`},
{id:"c63",t:"dist",r:R`$\dfrac{\mathbb P(A_j)\,\mathbb P_{A_j}(B)}{\sum_{i=1}^n\mathbb P(A_i)\,\mathbb P_{A_i}(B)}$ : où interviennent les probabilités totales et les probabilités composées ?`,v:R`Au numérateur, les probabilités <b>composées</b> donnent $\mathbb P(A_j\cap B)$. Au dénominateur, les probabilités <b>totales</b> donnent $\mathbb P(B)$. Le quotient est $\mathbb P_B(A_j)$ (formule de Bayes).`},
{id:"c64",t:"dist",r:"La formule des probabilités composées fait-elle apparaître une somme ou un produit ?",v:R`Un <b>produit</b> : $\mathbb P(A_1\cap\dots\cap A_n)=\mathbb P(A_1)\,\mathbb P_{A_1}(A_2)\cdots\mathbb P_{A_1\cap\dots\cap A_{n-1}}(A_n)$.`},
{id:"c65",t:"dist",r:"La formule des probabilités totales fait-elle apparaître une somme ou un produit ?",v:R`Une <b>somme</b> : $\mathbb P(B)=\sum_{i=1}^n\mathbb P(A_i\cap B)$, ou $\sum_{i=1}^n\mathbb P(A_i)\times\mathbb P_{A_i}(B)$ (chaque terme est alors un produit).`},
{id:"c66",t:"dist",r:"La formule de Bayes fait-elle apparaître une somme ou un produit ?",v:R`Les deux : un <b>produit</b> au numérateur et une <b>somme</b> au dénominateur. $\mathbb P_B(A_j)=\dfrac{\mathbb P(A_j)\,\mathbb P_{A_j}(B)}{\sum_{i=1}^n\mathbb P(A_i)\,\mathbb P_{A_i}(B)}$.`},
{id:"c67",t:"union",r:"Théorème : probabilité d'une réunion disjointe (hypothèse et conclusion). Somme ou produit ?",v:R`Si $\forall (i,j)\in[\![1;n]\!]^2,\ i\neq j\Longrightarrow A_i\cap A_j=\varnothing$, alors $\mathbb P\Big(\bigcup_{i=1}^n A_i\Big)=\sum_{i=1}^n\mathbb P(A_i)$ : une <b>somme</b>.`},
{id:"c68",t:"union",r:R`Formule du crible à l'ordre 2 : $\mathbb P(A\cup B)=$ ?`,v:R`$\mathbb P(A\cup B)=\mathbb P(A)+\mathbb P(B)-\mathbb P(A\cap B)$. Même formule pour les cardinaux.`},
{id:"c69",t:"union",r:R`Formule du crible à l'ordre 3 : $\mathbb P(A\cup B\cup C)=$ ?`,v:R`$\mathbb P(A)+\mathbb P(B)+\mathbb P(C)-\mathbb P(A\cap B)-\mathbb P(A\cap C)-\mathbb P(B\cap C)+\mathbb P(A\cap B\cap C)$. Même formule pour les cardinaux.`},
{id:"c70",t:"union",r:"Comment vérifier qu'une famille d'événements est un système complet ?",v:R`On vérifie ① que leur réunion est $\Omega$ (chaque résultat en réalise au moins un) et ② que $\forall (i,j),\ i\neq j\Longrightarrow A_i\cap A_j=\varnothing$ (aucun résultat n'en réalise deux).`},
{id:"c18",t:"loi",r:R`Loi de Bernoulli $\mathcal B(p)$ : définition, espérance, variance.`,v:R`$p\in\,]0,1[$, $X(\Omega)=\{0,1\}$, $\mathbb P([X=1])=p$, $\mathbb P([X=0])=1-p$. $\mathbb E(X)=p$, $V(X)=p(1-p)$. Si $A$ est un événement, $\mathbf 1_A\hookrightarrow\mathcal B\big(\mathbb P(A)\big)$.`},
{id:"c19",t:"loi",r:R`Loi binomiale $\mathscr B(n,p)$ : situation type, loi, espérance, variance.`,v:R`Schéma de Bernoulli : $n$ épreuves identiques et indépendantes, succès de probabilité $p$, $X$ = nombre de succès. $X(\Omega)=[\![0;n]\!]$, $\mathbb P([X=k])=\binom nk p^k(1-p)^{n-k}$. $\mathbb E(X)=np$, $V(X)=np(1-p)$.`},
{id:"c34",t:"loi",r:R`Somme de $n$ variables de Bernoulli : quelle loi, sous quelles hypothèses ?`,v:R`Si $X_1,\dots,X_n$ sont mutuellement indépendantes et suivent toutes $\mathcal B(p)$, alors $X_1+\dots+X_n\hookrightarrow\mathscr B(n,p)$.`},
{id:"c20",t:"loi",r:R`Loi uniforme sur $[\![1;n]\!]$, puis sur $[\![a;b]\!]$ : loi, espérance, variance.`,v:R`$\mathcal U([\![1;n]\!])$ : $\mathbb P([X=i])=\frac1n$, $\mathbb E(X)=\frac{n+1}2$, $V(X)=\frac{n^2-1}{12}$.<br>$\mathcal U([\![a;b]\!])$ : $\mathbb P([X=i])=\frac1{b-a+1}$, $\mathbb E(X)=\frac{a+b}2$, $V(X)=\frac{(b-a+1)^2-1}{12}$.`},
{id:"c35",t:"loi",r:"Variable certaine égale à a : loi, espérance, variance.",v:R`$X(\Omega)=\{a\}$, $\mathbb P([X=a])=1$, $\mathbb E(X)=a$, $V(X)=0$.`},
{id:"c36",t:"var",r:"Qu'est-ce qu'une variable aléatoire sur Ω ?",v:R`Une application de $\Omega$ dans $\mathbb R$. Si $X(\Omega)=\{x_1,\dots,x_r\}$, les $[X=x_i]$ forment un système complet d'événements.`},
{id:"c27",t:"var",r:R`Que faut-il faire pour déterminer la loi de $X$ ?`,v:R`① Donner $X(\Omega)$ ; ② donner $\mathbb P([X=x_i])$ pour toutes les valeurs $x_i$ de $X(\Omega)$. Ces probabilités ont pour somme 1.`},
{id:"c28",t:"var",r:R`Définition de $\mathbb E(X)$ pour une variable aléatoire finie.`,v:R`$\mathbb E(X)=\sum_{x\in X(\Omega)}x\,\mathbb P([X=x])$.`},
{id:"c29",t:"var",r:"Définition de la fonction de répartition de X.",v:R`$F:x\mapsto\mathbb P([X\leqslant x])$, de $\mathbb R$ dans $[0;1]$. Pour $a\leqslant b$ : $\mathbb P([a\lt X\leqslant b])=F(b)-F(a)$.`},
{id:"c30",t:"var",r:R`Définition de $V(X)$. Quel est son signe ? Que dire si $V(X)=0$ ?`,v:R`$V(X)=\mathbb E\big((X-\mathbb E(X))^2\big)\geqslant0$. L'écart-type est $\sigma=\sqrt{V(X)}$. Si $V(X)=0$, alors $\mathbb P([X=\mathbb E(X)])=1$ : $X$ est quasi-certaine.`},
{id:"c37",t:"var",r:"Définition : X et Y sont indépendantes.",v:R`Pour tout $(x,y)\in X(\Omega)\times Y(\Omega)$ : $\mathbb P([X=x]\cap[Y=y])=\mathbb P([X=x])\times\mathbb P([Y=y])$. Alors $u(X)$ et $v(Y)$ sont aussi indépendantes.`},
{id:"c38",t:"var",r:R`Variable centrée, réduite ? Variable centrée réduite associée à $X$ ?`,v:R`Centrée : $\mathbb E(X)=0$. Réduite : $V(X)=1$. Si $V(X)\neq0$, $X^*=\dfrac{X-\mathbb E(X)}{\sigma_X}$ est centrée réduite.`},
{id:"c21",t:"var",r:"Théorème de transfert.",v:R`$\mathbb E\big(\varphi(X)\big)=\sum_{x\in X(\Omega)}\varphi(x)\,\mathbb P([X=x])$.`},
{id:"c22",t:"var",r:"Formule de Kœnig-Huygens.",v:R`$V(X)=\mathbb E(X^2)-\mathbb E(X)^2$.`},
{id:"c23",t:"var",r:R`$\mathbb E(aX+b)$ et $V(aX+b)$ ?`,v:R`$\mathbb E(aX+b)=a\,\mathbb E(X)+b$ et $V(aX+b)=a^2\,V(X)$.`},
{id:"c24",t:"var",r:R`$\mathbb E(XY)$ et $V(X+Y)$ : à quelle condition ?`,v:R`Si $X$ et $Y$ sont <b>indépendantes</b> : $\mathbb E(XY)=\mathbb E(X)\,\mathbb E(Y)$ et $V(X+Y)=V(X)+V(Y)$. Contre-exemple sans indépendance : $Y=X$ donne $V(2X)=4V(X)$.`}
];
let boxes=store.get("ap_boxes",{});
let fc={filter:"all",cur:null,flipped:false};
function boxOf(id){return boxes[id]||1}
function pickCard(){const list=CARDS.filter(c=>fc.filter==="all"||c.t===fc.filter);const m=Math.min(...list.map(c=>boxOf(c.id)));
  let cand=list.filter(c=>boxOf(c.id)===m);if(cand.length>1&&fc.cur)cand=cand.filter(c=>c.id!==fc.cur.id);fc.cur=cand[Math.floor(Math.random()*cand.length)];fc.flipped=false}
function renderCours(){
  const v=document.getElementById("v-cours");const f=["all",...Object.keys(THEMES).filter(k=>CARDS.some(c=>c.t===k))];
  v.innerHTML=`<div class="panel"><div class="eyebrow">Cours à savoir</div><h2>Se réciter le cours</h2>
  <p class="lead">Lire la question, <b>écrire la réponse sur un brouillon sans regarder</b>, puis retourner la fiche. « Je savais » envoie la fiche dans la boîte suivante ; « À revoir » la renvoie en boîte 1. Les fiches de la boîte la plus basse reviennent en premier.</p>
  <div class="chips" role="group" aria-label="Thème">${f.map(k=>`<button type="button" data-f="${k}" aria-pressed="${fc.filter===k}">${k==="all"?"Tout le cours":THEMES[k]}</button>`).join("")}</div></div>
  <div class="panel flash" id="flash"></div>
  <div class="panel"><div class="row spread"><h3>Mes boîtes</h3><button type="button" id="resetBoxes">Tout remettre en boîte 1</button></div><div class="boxes" id="boxes" style="margin-top:10px"></div></div>`;
  v.querySelector(".chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;fc.filter=b.dataset.f;fc.cur=null;renderCours()};
  v.querySelector("#resetBoxes").onclick=()=>{boxes={};store.set("ap_boxes",boxes);pickCard();renderFlash();renderBoxes()};
  if(!fc.cur)pickCard();renderFlash();renderBoxes();
}
function renderFlash(){
  const el=document.getElementById("flash");const c=fc.cur;
  el.innerHTML=`<div class="eyebrow">${THEMES[c.t]} · boîte ${boxOf(c.id)}</div><div class="recto">${c.r}</div>
  ${fc.flipped?`<div class="verso">${c.v}</div><div class="row"><button type="button" class="primary" data-ok="1">Je savais</button><button type="button" data-ok="0">À revoir</button></div>`:`<div class="row"><button type="button" class="primary" id="flip">Voir la réponse</button></div>`}`;
  el.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.id==="flip"){fc.flipped=true;renderFlash();return}
    if(b.dataset.ok!==undefined){boxes[c.id]=b.dataset.ok==="1"?Math.min(3,boxOf(c.id)+1):1;store.set("ap_boxes",boxes);pickCard();renderFlash();renderBoxes()}};
  tex(el);
}
function renderBoxes(){const el=document.getElementById("boxes");if(!el)return;const list=CARDS.filter(c=>fc.filter==="all"||c.t===fc.filter);
  const n=[1,2,3].map(k=>list.filter(c=>boxOf(c.id)===k).length);
  el.innerHTML=`<span>Boîte 1 (à apprendre) : ${n[0]}</span><span>Boîte 2 : ${n[1]}</span><span>Boîte 3 (su) : ${n[2]}</span>`}

/* ======================= MÉTHODE ======================= */
function renderMethode(){
  const v=document.getElementById("v-methode");
  v.innerHTML=R`<div class="panel"><div class="eyebrow">Comment apprendre</div><h2>Apprendre son cours de maths</h2>
  <ol>
  <li><b>Relire n'est pas apprendre.</b> On connaît une définition quand on peut l'écrire sans regarder, avec ses hypothèses. Une page relue paraît familière, mais cela ne prouve pas qu'on la sait.</li>
  <li><b>Se tester.</b> Cacher, écrire, vérifier, corriger en rouge. L'onglet « Cours à savoir » sert à ça : on écrit la réponse <i>avant</i> de retourner la fiche. Le quiz vérifie ensuite qu'on sait s'en servir.</li>
  <li><b>Espacer.</b> 10 minutes le soir du cours, puis 2 jours après, puis une semaine après. Quatre séances de 10 minutes valent mieux qu'une séance de 40 minutes la veille de la colle.</li>
  <li><b>Pour chaque théorème, apprendre quatre choses</b> : les hypothèses, la conclusion, un exemple, et ce qui se passe si une hypothèse manque.
  <span class="phrase">$V(X+Y)=V(X)+V(Y)$ demande $X$ et $Y$ indépendantes. Si $Y=X$ : $V(2X)=4V(X)$.</span></li>
  <li><b>Séparer les mots qui se ressemblent.</b> Résultat / événement, liste / partie, <span style="white-space:nowrap">$\in$ / $\subset$,</span> incompatibles / indépendants. Pour chaque paire, savoir donner un exemple de l'un qui n'est pas l'autre.</li>
  <li><b>Apprendre les phrases de rédaction</b>, mot pour mot :
  <span class="phrase">« $(A_1,\dots,A_n)$ est un système complet d'événements et $\mathbb P(A_i)\neq0$ pour tout $i$. D'après la formule des probabilités totales, … »</span>
  <span class="phrase">« Cette expérience est constituée de $n$ épreuves de Bernoulli identiques et indépendantes (succès : … de probabilité $p$). $X$ compte le nombre de succès, donc $X\hookrightarrow\mathscr B(n,p)$. »</span></li>
  <li><b>Avant une colle</b>, réciter les questions de cours à voix haute pendant 15 minutes. Le colleur commence par là.</li>
  </ol></div>
  <div class="panel"><h3>Mon plan pour la semaine</h3>
  <p class="small">Cocher au fur et à mesure (reste sur cet appareil).</p>
  <div class="stack" id="plan" style="gap:6px;margin-top:8px"></div></div>`;
  const tasks=["Le soir du cours : 10 min de fiches « Cours à savoir »","2 jours après : une série de quiz par thème","Rejouer mes erreurs jusqu'à ce que la liste soit vide","Une semaine après : toutes les fiches de la boîte 1, puis une série « Tout mélanger »","Veille de colle : réciter à voix haute les définitions et théorèmes"];
  const done=store.get("ap_plan",{});
  const p=v.querySelector("#plan");
  p.innerHTML=tasks.map((t,i)=>`<label class="row" style="gap:10px;align-items:flex-start;flex-wrap:nowrap"><input type="checkbox" id="plan${i}" ${done[i]?"checked":""} style="margin-top:.35em"><span>${t}</span></label>`).join("");
  p.addEventListener("change",e=>{const m=e.target.id.match(/plan(\d+)/);if(!m)return;done[m[1]]=e.target.checked;store.set("ap_plan",done)});
  tex(v);
}

/* ======================= ROUTAGE ======================= */
const VIEWS=["quiz","cours","methode"];const rendered={};
function show(){
  let h=(location.hash||"#quiz").slice(1);
  const mc=h.match(/^classe-(\d+)$/);if(mc)h="quiz";
  if(!VIEWS.includes(h))h="quiz";
  VIEWS.forEach(k=>{document.getElementById("v-"+k).hidden=k!==h});
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.view===h)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(!rendered[h]){rendered[h]=true;({quiz:renderQuiz,cours:renderCours,methode:renderMethode})[h]()}
  if(mc)startClasse(+mc[1]-1);
}
window.addEventListener("hashchange",show);
show();
</script>
